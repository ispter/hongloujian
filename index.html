<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>红楼梦 H5</title>
    <style>
      :root {
        font-family: "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
        background: url("./images/bg.png") center / cover no-repeat;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
      }

      .viewport {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: url("./images/bg.png") center / cover no-repeat;
        opacity: 1;
        filter: blur(0);
        transition: opacity 0.5s ease, filter 0.5s ease;
      }

      .viewport.is-leaving {
        opacity: 0;
        filter: blur(3px);
      }

      .page {
        position: relative;
        width: 375px;
        height: 812px;
        transform-origin: center center;
        flex: 0 0 auto;
        overflow: hidden;
        background: url("./images/bg.png") center / cover no-repeat;
      }

      .page img {
        position: absolute;
        display: block;
        height: auto;
        user-select: none;
        pointer-events: none;
        -webkit-user-drag: none;
      }

      .cloud {
        position: absolute;
        pointer-events: none;
        z-index: 1;
      }

      .cloud svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .plum-branch {
        top: -35px;
        right: -32px;
        width: 214px;
        opacity: 0.71;
        transform-origin: 182px 21px;
        animation: branch-sway 5.5s ease-in-out infinite;
      }

      .fund-logo {
        top: 32px;
        left: 97.5px;
        width: 180px;
      }

      .kite {
        top: 159px;
        left: 48px;
        width: 46px;
        transform: rotate(-15deg);
        transform-origin: 55% 58%;
        z-index: 10;
        animation: kite-drift 5.2s ease-in-out infinite;
        will-change: transform;
      }

      .kite-line {
        position: absolute;
        inset: 0;
        width: 375px;
        height: 812px;
        transform: translateY(-60px);
        transform-origin: 356px 730px;
        pointer-events: none;
        z-index: 1;
        animation: kite-line-drift 5.2s ease-in-out infinite;
        will-change: transform;
      }

      .cloud-left {
        top: 271px;
        left: 60px;
        width: 110px;
        height: 41px;
        animation: cloud-float-left 6s ease-in-out infinite;
      }

      .cloud-right {
        top: 440px;
        right: 28px;
        width: 138px;
        height: 51px;
        animation: cloud-float-right 7s ease-in-out infinite;
      }

      .bookmark-panel {
        top: 192px;
        left: 153px;
        width: 69px;
        z-index: 2;
      }

      .garden {
        left: 0;
        bottom: 0;
        width: 375px;
        opacity: 0.6;
        z-index: 0;
      }

      .enter-button {
        left: 111px;
        bottom: 140px;
        width: 153px;
        z-index: 10;
        animation: button-breathe 2.4s ease-in-out infinite;
      }

      .enter-link {
        position: absolute;
        left: 111px;
        bottom: 140px;
        width: 153px;
        height: 42px;
        z-index: 11;
        display: block;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .publisher-logo {
        left: 127.5px;
        bottom: 51px;
        width: 120px;
        z-index: 2;
      }

      .petal {
        z-index: 3;
        animation: petal-fall 9s linear infinite;
      }

      .petal-a { top: 140px; left: 96px; width: 24px; animation-delay: 0s; }
      .petal-b { top: 255px; left: 29px; width: 20px; animation-delay: -3s; }
      .petal-c { top: 391px; right: 19px; width: 34px; animation-delay: -6s; }
      .petal-d { left: 82px; bottom: 185px; width: 38px; animation-delay: -2s; }
      .petal-e { left: 38px; bottom: 39px; width: 54px; animation-delay: -8s; }
      .petal-f { top: 183px; right: 28px; width: 22px; animation-delay: -4s; }
      .petal-g { top: 512px; left: 44px; width: 28px; animation-delay: -7s; }
      .petal-h { top: 585px; right: 58px; width: 32px; animation-delay: -1s; }
      .petal-i { top: 77px; left: 160px; width: 18px; animation-delay: -5s; }
      .petal-j { top: 114px; left: 30px; width: 20px; animation-delay: -9s; }
      .petal-k { top: 284px; right: 86px; width: 24px; animation-delay: -6.5s; }
      .petal-l { top: 422px; left: 118px; width: 30px; animation-delay: -2.5s; }
      .petal-m { top: 633px; right: 24px; width: 26px; animation-delay: -10s; }
      .petal-n { top: 49px; right: 12px; width: 24px; animation-delay: -1.2s; }
      .petal-o { top: 195px; right: 72px; width: 18px; animation-delay: -4.4s; }
      .petal-p { top: 341px; right: 18px; width: 30px; animation-delay: -7.6s; }
      .petal-q { top: 471px; right: 120px; width: 22px; animation-delay: -3.1s; }
      .petal-r { top: 666px; right: 48px; width: 34px; animation-delay: -6.2s; }

      @keyframes petal-fall {
        0% {
          transform: translate3d(42px, -30px, 0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        45% {
          transform: translate3d(-28px, 120px, 0) rotate(-24deg);
        }
        100% {
          transform: translate3d(-92px, 260px, 0) rotate(-72deg);
          opacity: 0.72;
        }
      }

      @keyframes cloud-float-left {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(-7px, 3px, 0); }
      }

      @keyframes cloud-float-right {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(7px, -3px, 0); }
      }

      @keyframes branch-sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(1.8deg); }
      }

      @keyframes button-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
      }

      @keyframes kite-drift {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(-15deg); }
        25% { transform: translate3d(4px, -5px, 0) rotate(-11deg); }
        50% { transform: translate3d(0, -10px, 0) rotate(-16deg); }
        75% { transform: translate3d(-4px, -4px, 0) rotate(-19deg); }
      }

      @keyframes kite-line-drift {
        0%, 100% { transform: translate3d(0, -60px, 0) rotate(0deg); }
        25% { transform: translate3d(3px, -64px, 0) rotate(0.22deg); }
        50% { transform: translate3d(0, -68px, 0) rotate(-0.12deg); }
        75% { transform: translate3d(-3px, -63px, 0) rotate(-0.25deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .kite,
        .kite-line {
          animation: none;
        }

        .viewport {
          transition: none;
        }
      }
    </style>

    <script>
      const DESIGN_WIDTH = 375;
      const DESIGN_HEIGHT = 812;

      function resizePage() {
        const page = document.querySelector(".page");
        if (!page) return;
        const viewportWidth = window.visualViewport?.width || document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = window.visualViewport?.height || document.documentElement.clientHeight || window.innerHeight;
        const isMobile = viewportWidth <= 600;
        const scale = isMobile
          ? viewportWidth / DESIGN_WIDTH
          : Math.min(viewportWidth / DESIGN_WIDTH, viewportHeight / DESIGN_HEIGHT);
        page.style.transform = `scale(${scale})`;
      }

      window.addEventListener("resize", resizePage);
      window.addEventListener("load", resizePage);
      window.visualViewport?.addEventListener("resize", resizePage);

      const enterLink = document.querySelector(".enter-link");
      enterLink?.addEventListener("click", (event) => {
        sessionStorage.setItem("redmansion-music-autoplay", "true");
        const transitionAudio = new Audio("./bg.MP3");
        transitionAudio.volume = 0.4;
        transitionAudio.play().catch(() => {});

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        event.preventDefault();
        document.querySelector(".viewport")?.classList.add("is-leaving");
        window.setTimeout(() => {
          window.location.href = enterLink.href;
        }, 480);
      });

      resizePage();
    </script>
