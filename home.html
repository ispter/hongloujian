<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红楼梦 H5</title>
    <link rel="stylesheet" href="./home-assets/app.css" />
    <link rel="stylesheet" href="./home-assets/transitions.css?v=9" />
    <style>
      #root {
        animation: home-fade-in 0.65s ease both;
      }

      @keyframes home-fade-in {
        from {
          opacity: 0;
          filter: blur(3px);
        }
        to {
          opacity: 1;
          filter: blur(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <audio id="background-music" src="./bg.MP3" loop preload="auto"></audio>
    <script defer src="./home-assets/app.js"></script>
    <script defer src="./home-assets/music-controller.js"></script>
    <script defer src="./home-assets/search-interaction.js"></script>
    <script defer src="./home-assets/copyright-interaction.js"></script>
  </body>
</html>
